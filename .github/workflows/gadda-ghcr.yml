
name: Publish GADDA to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gadda-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GADDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/brixta-eurofoam/gadda-store:latest
            ghcr.io/brixta-eurofoam/gadda-store:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Brixta-EUROFOAM/eurofoamdotin
          cache-from: type=gha
          cache-to: type=gha,mode=max
