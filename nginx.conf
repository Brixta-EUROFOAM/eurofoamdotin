user www-data;
worker_processes auto;
pid /run/nginx.pid;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    # Cloudflared / reverse proxy headers
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # EUROFOAM
    server {
        listen 127.0.0.1:8080;
        server_name eurofoam.in www.eurofoam.in;

        # Admin image uploads are currently capped at 12 MB in the app
        client_max_body_size 15M;

        location / {
            proxy_pass http://127.0.0.1:3700;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_connect_timeout 10s;

            proxy_buffering off;
        }

        # Next.js static assets can be cached aggressively
        location /_next/static/ {
            proxy_pass http://127.0.0.1:3700;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;

            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # User-uploaded CMS media
        location /media/ {
            proxy_pass http://127.0.0.1:3700;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;

            expires 30d;
            add_header Cache-Control "public";
        }
    }
}